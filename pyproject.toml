[project]
name = "air-cate"
version = "0.1.0"
description = "AIR estimator for time-varying conditional average treatment effects from right-censored data"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.30",
    "keras>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scikit-survival>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
    "ruff",
    "scipy",
]
plots = [
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_cate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
